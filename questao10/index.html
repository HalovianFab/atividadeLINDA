<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio de Brindes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎁 Sorteio de Brindes Tecnológicos</h1>

        <p>Digite seu nome para participar do sorteio!</p>

        <label for="nome">Nome do cliente:</label>

        <input 
            type="text" 
            id="nome" 
            placeholder="Digite seu nome"
        >

        <button id="sortear">Sortear Brinde</button>

        <div id="resultado"></div>

        <div id="premio"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
